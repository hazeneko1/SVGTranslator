<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animación Estrella Cinematográfica</title>
  <style>
    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f1520;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* ===== FONDO CON GLOW AZUL ===== */
    .glow {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }

    .glow1 {
      width: 600px;
      height: 600px;
      top: -200px;
      left: -150px;
      background: radial-gradient(ellipse, rgba(0, 194, 255, 0.12) 0%, transparent 70%);
    }

    .glow2 {
      width: 500px;
      height: 500px;
      bottom: -100px;
      right: -100px;
      background: radial-gradient(ellipse, rgba(0, 119, 255, 0.10) 0%, transparent 70%);
    }

    /* ===== CONTENEDOR ESTRELLA ===== */
    .star-cinema-wrapper {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      animation: wrapperFade 3.2s ease forwards;
    }

    @keyframes wrapperFade {
      0% {
        pointer-events: all;
      }

      90% {
        pointer-events: none;
      }

      100% {
        pointer-events: none;
      }
    }

    /* ===== LA ESTRELLA ===== */
    .star-cinema {
      position: fixed;
      top: 0;
      left: 0;
      width: 130px;
      height: 130px;
      offset-anchor: 65px 65px;
      offset-rotate: 0deg;
      filter: drop-shadow(0 0 50px rgba(0, 119, 255, 0.8)) drop-shadow(0 0 100px rgba(0, 194, 255, 0.5));
      animation:
        starMotion 3.5s cubic-bezier(0.16, 0.5, 0.3, 1) 0.1s forwards,
        starScaleOpacity 3.5s cubic-bezier(0.16, 0.5, 0.3, 1) 0.1s forwards;
    }

    @keyframes starMotion {
      from {
        offset-distance: 0%;
      }

      to {
        offset-distance: 100%;
      }
    }

    @keyframes starScaleOpacity {
      from {
        transform: scale(16);
        opacity: 1;
        filter: drop-shadow(0 0 80px rgba(0, 194, 255, 1)) drop-shadow(0 0 160px rgba(0, 119, 255, 0.8));
      }

      to {
        transform: scale(1);
        opacity: 0.18;
        filter: drop-shadow(0 0 8px rgba(0, 119, 255, 0.2));
      }
    }

    /* ===== TEXTO DE EJEMPLO (fondo del "sitio") ===== */
    .demo-text {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.08);
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      pointer-events: none;
      user-select: none;
    }

    .demo-text span {
      color: rgba(0, 194, 255, 0.12);
    }
  </style>
</head>

<body>

  <!-- Fondos glow -->
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <!-- Texto fantasma del "sitio" debajo de la estrella -->
  <div class="demo-text">
    NekoPhase199<br>demo<br><span>©</span>
  </div>

  <script>
    // ==========================================================================
    // MOTION PATH: construye la curva S en píxeles reales del viewport
    // offset-path no acepta vw/vh dentro de path(), así que lo hacemos con JS
    // ==========================================================================
    (function initStarPaths() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;

      var sx = vw * 0.09, sy = vh * 0.13;   // START
      var c1x = vw * 0.53, c1y = vh * 0.19;   // tirador de inicio
      var c2x = vw * 0.23, c2y = vh * 0.54;   // tirador de fin
      var ex = vw * 0.07, ey = vh * 0.33;   // END

      function buildPath(ox, oy) {
        return 'M ' + (sx + ox) + ',' + (sy + oy) +
          ' C ' + (c1x + ox) + ',' + (c1y + oy) +
          ' ' + (c2x + ox) + ',' + (c2y + oy) +
          ' ' + (ex + ox) + ',' + (ey + oy);
      }

      var star = document.querySelector('.star-cinema');
      if (star) {
        var p = buildPath(0, 0);
        console.log('star path:', p);
        star.style.offsetPath = "path('" + p + "')";
      }

      // --- DEBUG: añade ?debug=1 a la URL para ver la curva y los tiradores ---
      if (window.location.search.includes('debug=1')) {
        var ns = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('width', vw);
        svg.setAttribute('height', vh);
        svg.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;pointer-events:none';

        function dot(x, y, color, r) {
          var c = document.createElementNS(ns, 'circle');
          c.setAttribute('cx', x); c.setAttribute('cy', y);
          c.setAttribute('r', r || 6); c.setAttribute('fill', color);
          svg.appendChild(c);
        }
        function line(x1, y1, x2, y2, color) {
          var l = document.createElementNS(ns, 'line');
          l.setAttribute('x1', x1); l.setAttribute('y1', y1);
          l.setAttribute('x2', x2); l.setAttribute('y2', y2);
          l.setAttribute('stroke', color); l.setAttribute('stroke-width', 2);
          l.setAttribute('stroke-dasharray', '6,4');
          svg.appendChild(l);
        }

        var dp = document.createElementNS(ns, 'path');
        dp.setAttribute('d', buildPath(0, 0));
        dp.setAttribute('stroke', 'rgba(255,255,255,0.5)');
        dp.setAttribute('stroke-width', 2);
        dp.setAttribute('fill', 'none');
        svg.appendChild(dp);

        line(sx, sy, c1x, c1y, 'orange');
        line(ex, ey, c2x, c2y, 'orange');
        dot(c1x, c1y, 'orange', 5);
        dot(c2x, c2y, 'orange', 5);
        dot(sx, sy, 'red', 7);
        dot(ex, ey, 'red', 7);

        document.body.appendChild(svg);
      }
    })();
